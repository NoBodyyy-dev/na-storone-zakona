# Сайт коллегии «На стороне Закона»: статика + прокси к боту.
# После выпуска сертификата раскомментируйте блок HTTPS ниже
# и замените ДОМЕН на свой (см. DEPLOY.md).

server {
    listen 80;
    server_name _;

    # подтверждение домена для Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # служебные маршруты бота (health-check и вебхук Telegram)
    location = /health {
        proxy_pass http://bot:3000/health;
        proxy_set_header Host $host;
    }
    location = /webhook {
        proxy_pass http://bot:3000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # картинки, стили, документы — кэш на неделю
    location ~* \.(jpg|jpeg|png|webp|svg|css|js|pdf|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # чистые URL: /ceny откроет ceny.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}

