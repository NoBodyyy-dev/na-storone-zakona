# Сайт коллегии «На стороне Закона»: статика + прокси к боту.

# Не раскрываем версию nginx в заголовке Server и на страницах ошибок.
server_tokens off;

# Ограничение частоты запросов: защита бота и сайта от флуда с одного адреса.
# Зоны объявляются на уровне http — conf.d подключается именно туда.
limit_req_zone $binary_remote_addr zone=site:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=bot:1m     rate=5r/s;
limit_req_status 429;

# HTTP: только acme-challenge и редирект на HTTPS
server {
    listen 80;
    server_name ns-zakona.ru www.ns-zakona.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ns-zakona.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ns-zakona.ru www.ns-zakona.ru;

    ssl_certificate     /etc/letsencrypt/live/ns-zakona.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ns-zakona.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # www → без www
    if ($host = www.ns-zakona.ru) {
        return 301 https://ns-zakona.ru$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json
               application/manifest+json application/xml;
    gzip_min_length 1024;

    limit_req zone=site burst=40 nodelay;

    # ── Заголовки безопасности ─────────────────────────────────────────────
    # ВАЖНО: add_header внутри location отменяет заголовки родительского блока,
    # поэтому этот же набор повторён в каждом location, где есть свой add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Разрешены только свои ресурсы, Google Fonts, карта Яндекса и Метрика (включается после согласия).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://mc.yandex.ru https://mc.yandex.com; connect-src 'self' https://mc.yandex.ru https://mc.yandex.com; frame-src https://yandex.ru https://*.yandex.ru https://mc.yandex.ru; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests" always;

    # Служебные файлы редакторов и системы не отдаём никогда.
    location ~ /\.(?!well-known) { return 404; }
    location ~* (?:^|/)(?:\.DS_Store|Thumbs\.db|.*\.(?:bak|orig|swp|tmp|log|sql|env))$ { return 404; }

    # Health-check бота — только изнутри сервера и docker-сети, не для интернета.
    location = /health {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://bot:3000/health;
        proxy_set_header Host $host;
    }

    # Вебхук Telegram. Бот сам проверяет секрет (X-Telegram-Bot-Api-Secret-Token),
    # здесь дополнительно: только POST, только с адресов Telegram и с лимитом частоты.
    location = /webhook {
        limit_req zone=bot burst=20 nodelay;
        limit_except POST { deny all; }
        # Подсети Telegram Bot API: https://core.telegram.org/bots/webhooks#the-short-version
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;
        client_max_body_size 1m;
        proxy_pass http://bot:3000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Telegram Mini App (форма записи и панель адвоката) и её API — их отдаёт бот.
    # ^~ — чтобы regex-локация статики ниже не перехватила app.js/app.css из папки сайта.
    # Свой add_header здесь отменяет сайтовые X-Frame-Options и CSP: веб-версия Telegram
    # открывает приложение во фрейме, а нужный CSP бот выставляет сам.
    location ^~ /app/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        proxy_pass http://bot:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        limit_req zone=bot burst=20 nodelay;
        client_max_body_size 64k;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        proxy_pass http://bot:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Единственный канонический адрес страницы: /ceny.html → /ceny, /index.html → /
    # Проверяем $request_uri (исходный запрос), а не $uri: внутренняя подстановка
    # index.html для «/» не должна попадать под редирект, иначе получится петля.
    if ($request_uri ~ "^/index\.html(\?|$)") { return 301 https://ns-zakona.ru/$is_args$args; }
    if ($request_uri ~ "^/(.+)\.html(\?|$)")  { return 301 https://ns-zakona.ru/$1$is_args$args; }

    location = /robots.txt   { access_log off; expires 1d; }
    location = /sitemap.xml  { access_log off; expires 1d; }

    # картинки, стили, документы — долгий кэш
    location ~* \.(jpg|jpeg|png|webp|svg|css|js|pdf|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        access_log off;
        try_files $uri =404;
    }

    # чистые URL: /ceny откроет ceny.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
