# Сайт коллегии «На стороне Закона»: статика + прокси к боту.

# HTTP: только acme-challenge и редирект на HTTPS
server {
    listen 80;
    server_name ns-zakona.ru www.ns-zakona.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ns-zakona.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ns-zakona.ru www.ns-zakona.ru;

    ssl_certificate     /etc/letsencrypt/live/ns-zakona.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ns-zakona.ru/privkey.pem;

    # www → без www
    if ($host = www.ns-zakona.ru) {
        return 301 https://ns-zakona.ru$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # служебные маршруты бота (health-check и вебхук Telegram)
    location = /health {
        proxy_pass http://bot:3000/health;
        proxy_set_header Host $host;
    }
    location = /webhook {
        proxy_pass http://bot:3000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # картинки, стили, документы — кэш на неделю
    location ~* \.(jpg|jpeg|png|webp|svg|css|js|pdf|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # чистые URL: /ceny откроет ceny.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
