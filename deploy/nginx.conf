# Сайт коллегии «На стороне Закона»: статика + прокси к боту.

# HTTP: только acme-challenge и редирект на HTTPS
server {
    listen 80;
    server_name ns-zakona.ru www.ns-zakona.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://ns-zakona.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ns-zakona.ru www.ns-zakona.ru;

    ssl_certificate     /etc/letsencrypt/live/ns-zakona.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ns-zakona.ru/privkey.pem;

    # www → без www
    if ($host = www.ns-zakona.ru) {
        return 301 https://ns-zakona.ru$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript image/svg+xml application/json
               application/manifest+json application/xml;
    gzip_min_length 1024;

    # безопасность
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # служебные маршруты бота (health-check и вебхук Telegram) — из выдачи исключаем
    location = /health {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://bot:3000/health;
        proxy_set_header Host $host;
    }
    location = /webhook {
        proxy_pass http://bot:3000/webhook;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Единственный канонический адрес страницы: /ceny.html → /ceny, /index.html → /
    # Проверяем $request_uri (исходный запрос), а не $uri: внутренняя подстановка
    # index.html для «/» не должна попадать под редирект, иначе получится петля.
    if ($request_uri ~ "^/index\.html(\?|$)") { return 301 https://ns-zakona.ru/$is_args$args; }
    if ($request_uri ~ "^/(.+)\.html(\?|$)")  { return 301 https://ns-zakona.ru/$1$is_args$args; }

    location = /robots.txt   { access_log off; expires 1d; }
    location = /sitemap.xml  { access_log off; expires 1d; }

    # картинки, стили, документы — долгий кэш
    location ~* \.(jpg|jpeg|png|webp|svg|css|js|pdf|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # чистые URL: /ceny откроет ceny.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
