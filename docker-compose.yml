name: na-storone-zakona

# Пароль базы берётся из файла .env рядом с этим compose (не хранится в git):
#   POSTGRES_PASSWORD=<длинная случайная строка>
# Без него compose не стартует — лучше упасть, чем поднять базу с паролем по умолчанию.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lawyers_bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env рядом с docker-compose.yml}
      POSTGRES_DB: lawyers_bot
    volumes:
      - db_data:/var/lib/postgresql/data
    # порт наружу не публикуем: база доступна только контейнерам
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawyers_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: ./lawyers-bot
    restart: unless-stopped
    env_file:
      - ./lawyers-bot/.env
    environment:
      DATABASE_URL: postgres://lawyers_bot:${POSTGRES_PASSWORD}@db:5432/lawyers_bot
      NODE_ENV: production
    # применяем миграции и запускаем бота
    command: sh -c "node dist/database/migrate.js && node dist/app.js"
    # порт 3000 наружу не публикуем: к боту ходит только nginx
    expose:
      - "3000"
    volumes:
      - bot_data:/app/data
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./client:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - bot

  # Прокси к Telegram (VLESS/Shadowsocks/...), если api.telegram.org недоступен с сервера.
  # Включается через COMPOSE_PROFILES=proxy в .env; конфиг — deploy/xray/config.json (не в git).
  # Наружу порт не публикуем: SOCKS5 на xray:1080 доступен только контейнерам.
  xray:
    image: teddysun/xray:26.10.31
    profiles: ["proxy"]
    restart: unless-stopped
    volumes:
      - ./deploy/xray/config.json:/etc/xray/config.json:ro
    expose:
      - "1080"

  # выпуск/продление сертификата Let's Encrypt (запускать по требованию, см. DEPLOY.md)
  certbot:
    image: certbot/certbot
    profiles: ["certs"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot

volumes:
  db_data:
  bot_data:
  certbot_certs:
  certbot_www:
